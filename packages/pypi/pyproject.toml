[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "turbo-luxury-paint-care"
version = "1.0.0"
description = "Choose between wax, sealant and ceramic coating for UAE sun, work out when paint protection is due and what it costs per year."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Turbo Luxury Car Wash" }]
keywords = ["car-care", "paint-protection", "wax", "ceramic-coating", "polishing", "uae", "abu-dhabi"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Intended Audience :: End Users/Desktop",
  "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://turboluxurycarwash.ae/services/car-polishing-abu-dhabi/"
Repository = "https://github.com/nbkdevs/turbo-luxury"
Issues = "https://github.com/nbkdevs/turbo-luxury/issues"

[project.scripts]
turbo-luxury-paint-care = "turbo_luxury_paint_care.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
