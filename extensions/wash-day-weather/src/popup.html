<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Wash Day Weather</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>Wash Day Weather</h1>
    <select id="units" aria-label="Units">
      <option value="metric">°C, km/h</option>
      <option value="imperial">°F, mph</option>
    </select>
  </header>
  <details id="where">
    <summary><span id="place">Choose a place</span> <span class="change">Change</span></summary>
    <form id="search" autocomplete="off">
      <input id="q" type="search" placeholder="Search a town or city" aria-label="Town or city" maxlength="80" required>
      <button type="submit">Search</button>
    </form>
    <ul id="results" class="results"></ul>
  </details>
  <p id="best" class="best" aria-live="polite">Search for your town or city to see the week ahead.</p>
  <ul id="days" class="days"></ul>
  <p id="status" class="status"></p>
  <p class="foot">Weather and dust data: Open-Meteo.com (CC BY 4.0)</p>
  <script src="lib.js"></script>
  <script src="popup.js"></script>
</body>
</html>
